<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency-Converter</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h2>Currency Converter</h2>
        <div class="amount">
            <label for="input">Amount</label>
            <input type="text" id="input" placeholder="Enter amount">
        </div>

        <div class="convert">
          <div class="from">
              <h5>From</h5>
           <div class="dropdown">
            <img src="https://flagcdn.com/us.svg" alt="">
            <select name="from">
            </select>
           </div>
          </div>

          <i class="fa-solid fa-right-left"></i>

          <div class="to">
                <h5>To</h5>
              <div class="dropdown">
                <img src="https://flagcdn.com/np.svg" alt="">
            <select name="to">
            </select>
              </div>
          </div>
        </div>

        <p class="finalValue">nothing for now</p>

        <div class="btn">
            <button class="convert-btn">Convert</button>
        </div>
    </main>

 <script src="codes.js"></script>
    <script src="app.js"></script>
   
</body>
</html>
